name: Deploy Frontend para AWS

on:
  push:
    branches:
      - main # ou main, dependendo da sua branch

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: screenai-frontend-repo
  # URL do seu backend na AWS (o IP que descobrimos no passo anterior)
  NEXT_PUBLIC_API_URL: https://appscreenai.com:8000

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Configurar Credenciais AWS
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login no Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: 🐳 Build e Push (Frontend)
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build \
          --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }} \
          --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
          --build-arg NEXT_PUBLIC_GEMINI_API_KEY=${{ secrets.NEXT_PUBLIC_GEMINI_API_KEY }} \
          -t $ECR_REGISTRY/screenai-frontend-repo:$IMAGE_TAG \
          -t $ECR_REGISTRY/screenai-frontend-repo:latest .
        docker push $ECR_REGISTRY/screenai-frontend-repo:$IMAGE_TAG
        docker push $ECR_REGISTRY/screenai-frontend-repo:latest
